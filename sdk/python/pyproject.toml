[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "singit"
version = "0.1.0"
description = "SingIt SDK: x402 payment and client-side spending allowance for SingIt Ask. Not published yet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "x402[evm]>=2.25.0,<3",
]

[project.optional-dependencies]
# Solana exact-scheme payments. The official x402 package has no Solana upto client yet (see README).
svm = [
  "x402[svm]>=2.25.0,<3",
]
test = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/singit"]
