name: Feature request
description: Suggest an improvement or a new integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Payment gateway (sign402-gateway)
        - Allowance contract (agent-allowance)
        - SingIt Ask (x402 endpoint)
        - MCP server
        - ElizaOS plugin
        - SDK
        - Web app / website
        - Documentation
        - Other
