name: Security gate

on:
  push:
    branches: [main, x402Bnkr]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rescan so newly published advisories surface without a push.
    - cron: "0 6 * * 1"

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sign402-gateway
      - name: Gateway unit tests
        working-directory: sign402-gateway
        run: python -m unittest discover -s tests
      - name: Install Telegram adapter test dependency
        run: pip install python-telegram-bot==22.5
      - name: Hermes plugin unit tests
        working-directory: hermes-plugins/sign402-wallet
        run: python -m unittest discover -s tests

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit gateway dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ./sign402-gateway
          pip-audit --skip-editable

  node-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [cdp-x402-service, singit-risk-check, tools/ledger-approve, sdk/typescript,
          integrations/elizaos-plugin, integrations/examples/langchain, integrations/examples/vercel-ai-sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        working-directory: ${{ matrix.component }}
        # Unit tests mock hardware; native USB install scripts are unnecessary.
        run: npm ci --ignore-scripts
      - name: Unit tests
        working-directory: ${{ matrix.component }}
        run: npm test

  sdk-python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk/python[test]"
      - name: SDK unit tests (offline, local mock merchant)
        working-directory: sdk/python
        run: python -m pytest -q

  website-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test website/tests/*.test.mjs

  bazaar-lint:
    # Offline: boots singit-ask in-process with fakes and checks the x402 / Bazaar metadata it advertises
    # (docs/bazaar-curation.md). No network, no payment, no secrets. The live CDP check is a separate,
    # manually triggered workflow (bazaar-validate.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install singit-ask dependencies
        working-directory: singit-ask
        run: npm ci --ignore-scripts
      - name: Bazaar metadata lint
        run: node scripts/bazaar-lint.mjs
      - name: Lint and validator unit tests
        run: node --test scripts/tests/*.test.mjs

  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: cdp-x402-service audit
        working-directory: cdp-x402-service
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
      - name: singit-risk-check audit
        working-directory: singit-risk-check
        run: npm audit --audit-level=moderate

  sdk-package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check npm package contents
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts
          npm pack --dry-run --json > /tmp/sdk-pack.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const files = JSON.parse(readFileSync('/tmp/sdk-pack.json'))[0].files.map(f => f.path);
          for (const file of ['index.d.ts', 'README.md', 'LICENSE', 'src/index.js']) assert(files.includes(file), file);
          assert(files.some(f => f.startsWith('src/')));
          assert(files.every(f => !/(^|\/)(test|tests|node_modules)(\/|$)/.test(f)));
          JS
      - name: Build and check Python distributions
        working-directory: sdk/python
        run: |
          pip install build twine
          python -m build
          twine check dist/*
          python <<'PYTHON'
          import glob
          import tarfile
          import zipfile
          from email.parser import Parser
          with zipfile.ZipFile(glob.glob('dist/*.whl')[0]) as wheel:
              names = wheel.namelist()
              assert not any(part in ('test', 'tests') for name in names for part in name.split('/'))
              metadata = Parser().parsestr(wheel.read(next(n for n in names if n.endswith('/METADATA'))).decode())
              assert metadata['Description-Content-Type'] == 'text/markdown'
              assert metadata.get_payload().strip() == open('README.md').read().strip()
              assert any(n.endswith('/licenses/LICENSE') for n in names)
          with tarfile.open(glob.glob('dist/*.tar.gz')[0]) as sdist:
              names = sdist.getnames()
              for file in ('README.md', 'LICENSE', 'pyproject.toml'):
                  assert any(n.endswith('/' + file) for n in names)
              assert not any(part in ('test', 'tests') for name in names for part in name.split('/'))
          PYTHON
