# Deploys website/ to Cloudflare Pages project singitai via Direct Upload with Wrangler.
# The project's Git link still points to the old bubon-ik repo path.
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Merging a change under website/ publishes singitai.app.
# Never add pull_request_target or run on forks.
name: Pages deploy

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages-deploy.yml"]
  workflow_dispatch:

permissions: { contents: read }

concurrency: { group: pages-deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=singitai --branch=main
